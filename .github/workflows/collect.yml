# Collecte MercatOr · exécution courte, un créneau de 5 minutes par run.
#
# Remplace la conception précédente, où une exécution occupait l'heure entière
# et où un seul retard de GitHub supprimait douze captures d'un coup. Ici un
# abandon ne coûte qu'un créneau, et le workflow de secours décalé le rattrape.
#
# Pas de groupe de concurrence : aucune exécution ne doit jamais être annulée
# au profit d'une autre. Les collisions sont réglées par le témoin de créneau
# côté collecteur et par la republication avec rebase.
name: collect

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Collecter plusieurs créneaux
        env:
          SWISS_TOKEN: ${{ secrets.SWISS_TOKEN }}
          IRELAND_API_KEY: ${{ secrets.IRELAND_API_KEY }}
          IDFM_API_KEY: ${{ secrets.IDFM_API_KEY }}
        run: |
          git config user.name "mercator-poc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub abandonne une grande partie des executions planifiees. Chaque
          # execution couvre donc plusieurs creneaux successifs : meme si une
          # seule sur six demarre, la couverture reste complete. Le temoin de
          # creneau, relu apres chaque pull, evite toute duplication.
          for i in $(seq 1 ${CRENEAUX:-6}); do
            git pull --rebase -q --autostash || true
            node src/collect.mjs || true
            git add -A data logs state
            if ! git diff --cached --quiet; then
              git commit -q -m "collecte $(date -u +%FT%H:%MZ)"
              for k in 1 2 3; do
                git push -q 2>/dev/null && break
                sleep $((RANDOM % 4 + 2)); git pull --rebase -q --autostash || true
              done
            fi
            # Le test seul renverrait 1 a la derniere iteration et ferait
            # echouer l'etape alors que la collecte s'est bien passee.
            if [ $i -lt ${CRENEAUX:-6} ]; then
              now=$(date +%s); suivant=$(( (now/300+1)*300 ))
              sleep $(( suivant - now + 5 ))
            fi
          done
          echo "collecte terminee"

