# Collecte de secours · décalée de deux minutes.
#
# Ne fait rien si le workflow principal a déjà servi le créneau : le collecteur
# sort immédiatement quand le témoin existe. Ce workflow n'existe donc que pour
# rattraper les exécutions que GitHub abandonne, sans jamais doubler les données.
name: collect-secours

on:
  # Campagne terminee le 15 aout 2026 : le declencheur est coupe pour ne pas
  # faire tourner des executions a vide. A retablir pour la prochaine saison.
  # schedule:
  #   - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Collecter plusieurs créneaux
        env:
          SWISS_TOKEN: ${{ secrets.SWISS_TOKEN }}
          IRELAND_API_KEY: ${{ secrets.IRELAND_API_KEY }}
          IDFM_API_KEY: ${{ secrets.IDFM_API_KEY }}
        run: |
          git config user.name "mercator-poc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Mesure du 4 aout : GitHub ne declenche le cron qu'une douzaine de
          # fois par jour, quelle que soit la frequence demandee. Avec 6 creneaux
          # par execution la couverture plafonnait a 25 %. Chaque execution
          # couvre donc desormais 36 creneaux, soit 3 heures : une douzaine de
          # declenchements suffit alors a couvrir la journee entiere. Le temoin
          # de creneau, relu apres chaque pull, evite toute duplication.
          for i in $(seq 1 ${CRENEAUX:-36}); do
            git pull --rebase -q --autostash || true
            node src/collect.mjs || true
            git add -A data logs state
            if ! git diff --cached --quiet; then
              git commit -q -m "collecte $(date -u +%FT%H:%MZ)"
              for k in 1 2 3; do
                git push -q 2>/dev/null && break
                sleep $((RANDOM % 4 + 2)); git pull --rebase -q --autostash || true
              done
            fi
            # Le test seul renverrait 1 a la derniere iteration et ferait
            # echouer l'etape alors que la collecte s'est bien passee.
            if [ $i -lt ${CRENEAUX:-36} ]; then
              now=$(date +%s); suivant=$(( (now/300+1)*300 ))
              sleep $(( suivant - now + 5 ))
            fi
          done
          echo "collecte terminee"

